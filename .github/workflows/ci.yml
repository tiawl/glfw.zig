name: ci

on:
  pull_request:
    branches:
      - trunk

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v2
    - name: Check zig is canonical
      shell: bash
      run: |
        zig fmt --check .

  maintainance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: Test updating
      shell: 'bash'
      run: |
        zig build -Dupdate -Dverbose

  user:
    strategy:
      matrix:
        os:
          - ubuntu
          - windows
          - macos
        repo:
          - cimgui
        branch:
          - trunk
          - docking
    runs-on: "${{ matrix.os }}-latest"
    steps:
    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}.zig"
        ref: "${{ matrix.branch }}"

    - name: Setup Zig
      uses: mlugg/setup-zig@v2

    - name: Prepare ${{ matrix.repo }}.zig/build.zig.zon
      env:
        URL: "git+${{ github.server_url }}/${{ github.repository }}#${{ github.event.pull_request.head.sha }}"
      shell: 'bash'
      run: |
        zig fetch --save "${URL}"

    - name: Test building ${{ matrix.repo }}.zig
      env:
        REPO: "${{ matrix.repo }}"
        RUNNER_TMP: "${{ runner.temp }}"
      shell: 'bash'
      run: |
        case "${REPO}" in
        ( 'cimgui' )
          renderers="{$(zig build -Dlist-renderers -Dseparator=,)}"
          eval "zig build -Dverbose -Dplatforms=GLFW -Drenderers=${renderers}" ;;
        ( * ) zig build -Dverbose ;;
        esac
