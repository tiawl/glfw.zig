name: ci

on:
  pull_request:
    branches:
      - trunk

env:
  ZIG_VERSION: "0.14.0"

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: mlugg/setup-zig@v1
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Check zig is canonical
      shell: bash
      run: |
        zig fmt --check .
  build:
    strategy:
      matrix:
        repo:
          - cimgui
    runs-on: ubuntu-latest
    steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v1
      with:
        version: ${{ env.ZIG_VERSION }}

    - name: Install packages
      env:
        REPO: "${{ matrix.repo }}"
      shell: 'bash'
      run: |
        case "${REPO}" in
        ( 'cimgui' )
          sudo apt-get install -y python3-venv mesa-utils
          printf 'ACTIVATE_DIR=bin\n' >> "${GITHUB_ENV}" ;;
        ( * ) ;;
        esac

    - uses: actions/checkout@v4
      with:
        repository: "${{ github.repository_owner }}/${{ matrix.repo }}.zig"

    - name: Activate python virtual env & install pip packages
      if: matrix.repo == 'cimgui'
      env:
        RUNNER_TMP: "${{ runner.temp }}"
      shell: 'bash'
      run: |
        python3 -m venv "${RUNNER_TMP}/venv"
        source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
        pip install ply

    - name: Prepare ${{ matrix.repo }}.zig/build.zig.zon
      env:
        URL: "git+${{ github.server_url }}/${{ github.repository }}#${{ github.event.pull_request.head.sha }}"
      shell: 'bash'
      run: |
        zig fetch --save "${URL}"

    - name: Test updating ${{ matrix.repo }}.zig
      env:
        REPO: "${{ matrix.repo }}"
        RUNNER_TMP: "${{ runner.temp }}"
      shell: 'bash'
      run: |
        case "${REPO}" in
        ( 'cimgui' )
          source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
          zig build -Dupdate -Dplatform=GLFW -Drenderer=Vulkan ;;
        ( * ) zig build -Dupdate ;;
        esac

    - name: Test fetching ${{ matrix.repo }}.zig
      env:
        REPO: "${{ matrix.repo }}"
        RUNNER_TMP: "${{ runner.temp }}"
        PR_BODY: "${{ github.event.pull_request.body }}"
      shell: 'bash'
      run: |
        opts="$(printf '%s' "${PR_BODY}" | sed -n "s/^\[${REPO} fetch opts\] \(.*\)/\1/p")"
        opts="${opts#"${opts%%[![:space:]]*}"}"
        opts="${opts%"${opts##*[![:space:]]}"}"
        set -f
        case "${REPO}" in
        ( 'cimgui' )
          source "${RUNNER_TMP}/venv/${ACTIVATE_DIR:-Scripts}/activate"
          zig build -Dfetch -Dplatform=GLFW -Drenderer=Vulkan ${opts} ;;
        ( * ) zig build -Dfetch ${opts} ;;
        esac
        set +f
