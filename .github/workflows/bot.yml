name: bot

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  zig-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: "${{ github.repository }}"
          ref: "${{ github.event.repository.default_branch }}"
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 'master'
      - name: Build
        shell: 'bash'
        run: zig build -freference-trace
  update:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: "${{ github.repository }}"
          ref: "${{ github.event.repository.default_branch }}"

      - name: Close every bot PRs
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: 'bash'
        run: |
          set -x
          declare -a pr_list=( $(gh pr list --author '@me' --state open --json 'number' | jq '.[] | .number') )
          for pr_nr in ${pr_list[@]}
          do
            gh pr close "${pr_nr}" --comment 'Outdated PR/issue' --delete-branch
          done
      - name: Check bot PRs are all closed
        shell: 'bash'
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -x
          if [[ "$(gh pr list --author '@me' --state open --json 'number' | jq length)" != '0' ]]
          then
            exit 1
          fi

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 'latest'
      - name: Setup git user information
        env:
          CHILD_BRANCH: "bot/${{ github.event.repository.default_branch }}"
          EMAIL: '<>'
          NAME: 'GitHub Actions[bot]'
        shell: 'bash'
        run: |
          set -x
          git config user.name "${NAME}"
          git config user.email "${EMAIL}"
          git checkout -b "${CHILD_BRANCH}"

      - name: Fetch
        id: fetch
        shell: 'bash'
        run: |
          set -x
          zig build -Dfetch -Dverbose -freference-trace

      - name: Diff
        if: steps.fetch.conclusion == 'success'
        id: diff
        shell: 'bash'
        run: |
          set -x
          diffs="$(git diff HEAD --name-only | wc -l)"
          printf 'len=%s\n' "${diffs}" >> "${GITHUB_OUTPUT}"

      - name: Update
        if: steps.fetch.conclusion == 'success' && steps.diff.outputs.len != '0'
        shell: 'bash'
        run: zig build -Dupdate -Dverbose -freference-trace

      - name: Create Pull Request
        if: steps.fetch.conclusion == 'success' && steps.diff.outputs.len != '0'
        env:
          CHILD_BRANCH: "bot/${{ github.event.repository.default_branch }}"
          PARENT_BRANCH: "${{ github.event.repository.default_branch }}"
          GH_TOKEN: "${{ github.token }}"
        shell: 'bash'
        run: |
          set -x
          git add -A
          git commit -m 'Bot: Update dependencies'
          git push --force --set-upstream origin "${CHILD_BRANCH}"
          gh pr create --base "${PARENT_BRANCH}" --fill --reviewer "${GITHUB_REPOSITORY_OWNER}"
